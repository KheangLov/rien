version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same 7-day wait as minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript compiler API,
      # which vue-tsc needs; stay on 6 until Vue's tooling supports 7 (PR #1).
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
